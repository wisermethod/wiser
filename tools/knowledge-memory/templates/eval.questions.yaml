# Databased retrieval checks over returned items, per references/schemas.md section 3.
# Fill per tools/knowledge-memory/references/backends.md Databased eval: questions are
# what the set must answer, located in corpus, not the node name. Count expected
# values against Canonical ideas. These empty rows are the scoring floor, not the pack.
# expected is a case-insensitive item string or "path:corpus/<file>".
# must_not_match is a string that must not appear in returned items.
# healthcheck --eval is databased-only; it cannot grade composed answers or filter as-of.
# Wiki eval is a human read of cited pages. Do not send it to healthcheck --eval.
# Floor: 5 single-hop, 5 two-hop, 2 as-of where dated facts exist, and 2 isolation
# questions once another dataset exists. As-of rows require a human dated-item read
# and are reported as an unresolved filtering gap by the tool. Do not drop them.

