# Backend contract: tools/knowledge-memory/references/backends.md
# Knowledge set recipe. One per set, at memory/knowledge/<set>/set.yaml in the owning root.
# Every key below is read by tools/knowledge-memory/scripts/knowledge_memory.py.
# A key the script does not know is refused by name; a required key that is
# missing is refused by name. Comments are yours to keep or cut.

set: example-set                    # slug: lowercase letters, digits, hyphens; equals this directory's name
dataset: exampleroot_example_set    # Dataset name, [a-z0-9_]+ : <root slug>_<set slug>
kind: book                          # book | blog | website | domain | mixed
owner: "[named person]"             # a person or role, never blank
sensitivity: internal               # public | internal | confidential

# Record permission before any source is read. Confirmation follows human review.
backend: wiki
close_intensity: core
# Contract values: lexical (Standard FTS5) or embedding (Pro nearest-neighbour).
# Cypher is the graph query language, not a third retrieval value; see backends.md.
# embedding is accepted only with backend: graph. Other values are refused.
# Optional embedding_file: a basename inside the person-scoped models/ folder;
# no path separators or .. . Omit to use the graph contract default.
retrieval: lexical
session_permission: ""             # "[name], YYYY-MM-DD": this session may process the material
canon_confirmed: ""                # human confirmation only: "[name], YYYY-MM-DD"

sources:
  include:                          # globs relative to this file
    - "corpus/**/*.md"
    - "corpus/**/*.txt"
  exclude:
    - "corpus/originals/**"

pack: general                       # "general" ships with the tool; or a path relative to this file to a
                                    # directory holding graph_model.py, ontology.ttl, extraction_prompt.md
node_sets:                          # topics inside this set, never a tenant boundary
  - "kind:book"
chunking: heading-aware             # heading-aware; heading then paragraph and sentence splits

review_cadence_days: 7              # review-pass is due when the last one is older than this
stale_after_days: 30                # a Candidate with one weak source older than this is a stale candidate

write_policy:
  agents_may_remember_episodes: false   # true lets Knowledge Curation record session episodes into this set

link_policy:
  auto_link:                        # an extracted name matching an existing Canonical of the same type by one of these
                                    # attaches to that node instead of standing beside it; no tool ever makes a node Canonical
    - exact_ontology_match
    - normalized_name_match_same_type

eval: eval.questions.yaml           # relative to this file; databased retrieval checks; wiki evaluation is a human read
