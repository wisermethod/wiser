<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zavvo</title>
<link rel="stylesheet" href="loop.css">
<link rel="stylesheet" href="piece.css">
<script src="loop.js" defer></script>
</head>
<body>
<main data-video-root>
<figure class="ax-loop ax-zavvo" data-clock="render" data-len="2">
  <p class="ax-desc">Zibble, pluvo, nembi, troff.</p>
  <div class="ax-frame">
    <div class="ax-stage" aria-hidden="true">
      <p class="ax-label ax-conclusion" data-keep>Zavvo</p>
      <svg class="ax-wires" viewBox="0 0 100 56.25" preserveAspectRatio="none">
        <path pathLength="1" data-at="0.7" data-from=".ax-s1" data-to=".ax-s2" d="M22 29 C25.67 29 25.67 29 28.67 29"></path>
        <path pathLength="1" data-at="1" data-from=".ax-s2" data-to=".ax-s3" d="M46.67 29 C50.33 29 50.33 29 53.33 29"></path>
        <path pathLength="1" data-at="1.3" data-from=".ax-s3" data-to=".ax-s4" d="M71.33 29 C75 29 75 29 78 29"></path>
      </svg>
      <div class="ax-box ax-s1" data-at="0.4"><span class="ax-label">Zibble</span></div>
      <div class="ax-box ax-s2" data-at="0.7"><span class="ax-label">Pluvo</span></div>
      <div class="ax-box ax-s3" data-at="1"><span class="ax-label">Nembi</span></div>
      <div class="ax-box ax-s4" data-at="1.3"><span class="ax-label">Troff</span></div>
      <i class="ax-fly" data-at="0.7" data-off="1.2" data-from=".ax-s1" data-to=".ax-s4"></i>
    </div>
    <button class="ax-btn" type="button" data-pause="Vimmo" data-play="Zumma" aria-label="Vimmo">Vimmo</button>
  </div>
</figure>
</main>
</body>
</html>
