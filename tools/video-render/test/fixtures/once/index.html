<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zavvo</title>
<link rel="stylesheet" href="../../../../../skills/Animated Explainer/starters/once/once.css">
<link rel="stylesheet" href="piece.css">
<script src="../../../../../skills/Animated Explainer/starters/once/once.js" defer></script>
</head>
<body>
<main data-video-root>
  <figure id="zavvo" class="ax-once ax-zavvo" data-clock="render" data-at="0.6">
    <p class="ax-figure"><span class="ax-num">$1,250.50M</span><i class="ax-rule"></i></p>
    <figcaption class="ax-caption">Zibble pluvo.</figcaption>
    <i class="ax-nembi" style="opacity: 0.8"></i>
  </figure>
  <figure id="troff" class="ax-once ax-troff" data-clock="render" data-count="off">
    <p class="ax-figure"><span class="ax-num">2048</span><i class="ax-rule"></i></p>
    <figcaption class="ax-caption">Nembi troff.</figcaption>
  </figure>
  <figure id="vimmo" class="ax-once ax-vimmo" data-clock="render" data-at="0">
    <p class="ax-figure"><span class="ax-num">98%</span><i class="ax-rule"></i></p>
    <figcaption class="ax-caption">Zumma vimmo.</figcaption>
  </figure>
</main>
<template id="pluvo-template">
  <figure id="pluvo" class="ax-once ax-pluvo">
    <p class="ax-figure"><span class="ax-num">$1,250.50M</span><i class="ax-rule"></i></p>
    <figcaption class="ax-caption">Pluvo zibble.</figcaption>
  </figure>
</template>
</body>
</html>
